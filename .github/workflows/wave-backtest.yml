name: Production Wave Verification

on:
  schedule:
    - cron: "50 2 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: Import observations, evaluate forecasts, or both
        type: choice
        required: true
        default: all
        options:
          - all
          - import
          - evaluate

permissions:
  contents: read

concurrency:
  group: production-wave-verification
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || (github.ref == 'refs/heads/main' && vars.WAVE_BACKTEST_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TZ: UTC
      APP_ENV: production
      DEPLOYMENT_MODE: admin
      ENABLE_ADMIN_API: "true"
      API_DEBUG: "false"
      COOKIE_SECURE: "true"
      PASSWORD_BREACH_CHECK_ENABLED: "true"
      CORS_ORIGINS: https://surfwinddata.com
      JWT_SECRET: ${{ secrets.WORKER_JWT_SECRET }}
      DATABASE_URL: ${{ secrets.POOLED_DATABASE_URL }}
      DB_SERVERLESS: "true"
      COPERNICUS_MARINE_USERNAME: ${{ secrets.COPERNICUS_MARINE_USERNAME }}
      COPERNICUS_MARINE_PASSWORD: ${{ secrets.COPERNICUS_MARINE_PASSWORD }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-wave-backtest.txt

      - name: Install verification dependencies
        run: pip install -r requirements-wave-backtest.txt

      - name: Import recent Copernicus observations
        if: github.event_name == 'schedule' || inputs.mode == 'all' || inputs.mode == 'import'
        shell: bash
        run: |
          start="$(date -u -d '72 hours ago' '+%Y-%m-%dT%H:%M:%SZ')"
          end="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          python -m scripts.copernicus_wave_observations \
            --start "$start" \
            --end "$end" \
            --minimum-observations 1

      - name: Select weekly evaluation window
        id: evaluation
        shell: bash
        run: |
          evaluate=false
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.mode }}" != "import" ]]; then
            evaluate=true
          elif [[ "${{ github.event_name }}" == "schedule" && "$(date -u '+%u')" == "7" ]]; then
            evaluate=true
          fi
          echo "evaluate=$evaluate" >> "$GITHUB_OUTPUT"
          if [[ "$evaluate" == "true" ]]; then
            echo "start=$(date -u -d '90 days ago' '+%Y-%m-%d')" >> "$GITHUB_OUTPUT"
            echo "end=$(date -u '+%Y-%m-%d')" >> "$GITHUB_OUTPUT"
          fi

      - name: Evaluate rolling wave evidence
        if: steps.evaluation.outputs.evaluate == 'true'
        run: >-
          python -m scripts.wave_backtest
          --start "${{ steps.evaluation.outputs.start }}"
          --end "${{ steps.evaluation.outputs.end }}"
          --model dwd-ewam
          --model dwd-gwam
          --model noaa-gfs-wave
          --output "$RUNNER_TEMP/wave-backtest.json"
          --artifact-uri "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          --minimum-forecast-samples 1
          --minimum-matched-values 1
          --minimum-matched-platforms 1

      - name: Upload verification evidence
        if: steps.evaluation.outputs.evaluate == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wave-backtest-${{ github.run_id }}
          path: ${{ runner.temp }}/wave-backtest.json
          if-no-files-found: error
          retention-days: 30
