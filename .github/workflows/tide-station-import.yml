name: Production Tide Station Catalog

on:
  schedule:
    - cron: "12 4 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: production-tide-station-catalog
  cancel-in-progress: false

jobs:
  import:
    if: github.event_name == 'workflow_dispatch' || (github.ref == 'refs/heads/main' && vars.TIDE_STATION_IMPORT_ENABLED == 'true')
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    env:
      TZ: UTC
      APP_ENV: production
      DEPLOYMENT_MODE: admin
      ENABLE_ADMIN_API: "true"
      API_DEBUG: "false"
      COOKIE_SECURE: "true"
      PASSWORD_BREACH_CHECK_ENABLED: "true"
      CORS_ORIGINS: https://surfwinddata.com
      JWT_SECRET: ${{ secrets.WORKER_JWT_SECRET }}
      DATABASE_URL: ${{ secrets.POOLED_DATABASE_URL }}
      DB_SERVERLESS: "true"

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install importer dependencies
        run: pip install -r requirements.txt

      - name: Require the tide-station schema contract
        run: |
          python - <<'PY'
          from sqlalchemy import inspect

          from app.db.session import engine

          required = {
              "tide_stations",
              "tide_station_aliases",
              "tide_sensors",
              "tide_observations",
          }
          missing = sorted(required - set(inspect(engine).get_table_names()))
          if missing:
              raise SystemExit(f"missing tide-station tables: {', '.join(missing)}")
          print("tide-station schema contract: ok")
          PY

      - name: Refresh free PEGELONLINE catalogue
        run: python -m scripts.tide_station_import
