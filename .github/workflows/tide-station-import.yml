name: Production Tide Station Catalog

on:
  schedule:
    - cron: "12 4 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: production-tide-station-catalog
  cancel-in-progress: false

jobs:
  import:
    if: github.event_name == 'workflow_dispatch' || (github.ref == 'refs/heads/main' && vars.TIDE_STATION_IMPORT_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: UTC
      APP_ENV: production
      DEPLOYMENT_MODE: admin
      ENABLE_ADMIN_API: "true"
      API_DEBUG: "false"
      COOKIE_SECURE: "true"
      PASSWORD_BREACH_CHECK_ENABLED: "true"
      CORS_ORIGINS: https://surfwinddata.com
      JWT_SECRET: ${{ secrets.WORKER_JWT_SECRET }}
      DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
      DB_SERVERLESS: "true"

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install importer dependencies
        run: pip install -r requirements.txt

      - name: Require deployed schema head
        shell: bash
        run: |
          test -n "$DATABASE_URL"
          current="$(alembic current 2>/dev/null | tail -1 | awk '{print $1}')"
          expected="$(python -c 'from app.db.schema import EXPECTED_DB_REVISION; print(EXPECTED_DB_REVISION)')"
          test "$current" = "$expected"

      - name: Refresh free PEGELONLINE catalogue
        run: python -m scripts.tide_station_import
