name: Persistent LiveWind Station Residuals

on:
  schedule:
    - cron: "8,18,28,38,48,58 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: persistent-live-wind-station-residuals
  cancel-in-progress: false

jobs:
  residuals:
    if: github.ref == 'refs/heads/main' && vars.LIVE_WIND_RESIDUALS_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TZ: UTC
      APP_ENV: development
      DEPLOYMENT_MODE: development
      ENABLE_ADMIN_API: "false"
      DATABASE_URL: ${{ secrets.LIVE_WIND_POINT_DATABASE_URL }}
      WEATHER_OBSERVATION_CRON_BATCH_SIZE: ${{ vars.LIVE_WIND_RESIDUAL_BATCH_SIZE || '25' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Validate fail-closed residual configuration
        shell: bash
        run: test -n "$DATABASE_URL"

      - name: Install application dependencies
        run: pip install -r requirements.txt

      - name: Calculate residuals from pre-observation exact points only
        run: python -m scripts.exact_run_worker persisted-residuals
