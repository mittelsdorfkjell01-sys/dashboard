name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: surf
          POSTGRES_PASSWORD: surf
          POSTGRES_DB: surfwind_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U surf -d surfwind_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 5s --health-retries 20
    env:
      CI: "true"
      APP_ENV: test
      DEPLOYMENT_MODE: admin
      ENABLE_ADMIN_API: "true"
      DATABASE_URL: postgresql+psycopg://surf:surf@localhost:5432/surfwind_test
      TEST_DATABASE_URL: postgresql+psycopg://surf:surf@localhost:5432/surfwind_test
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt pip-audit ruff
      - run: python -m compileall -q app alembic
      - run: ruff check app tests scripts --select E9,F63,F7,F82
      - run: python -m pip_audit -r requirements.txt
      - run: pytest -q
      - run: python scripts/cleanup_media.py --grace-hours 0
      - run: python scripts/cleanup_personal_data.py
      - name: Migration round trip
        run: |
          alembic downgrade base
          alembic upgrade head
          test "$(alembic heads | wc -l)" -eq 1

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npx tsc --noEmit --pretty false
      - name: Public build and budget
        run: npm run build && npm run check:bundle
      - name: Admin build and budget
        env:
          VITE_INCLUDE_ADMIN: "true"
        run: npm run build:release && npm run check:bundle
      - name: Dependency audit
        run: npm audit --audit-level=critical
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
