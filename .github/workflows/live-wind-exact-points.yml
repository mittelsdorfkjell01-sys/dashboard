name: Persistent LiveWind Exact Point Capture

on:
  schedule:
    - cron: "1,11,21,31,41,51 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: persistent-live-wind-exact-points
  cancel-in-progress: false

jobs:
  capture:
    if: github.ref == 'refs/heads/main' && vars.LIVE_WIND_POINT_CAPTURE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: UTC
      APP_ENV: development
      DEPLOYMENT_MODE: development
      ENABLE_ADMIN_API: "false"
      DATABASE_URL: ${{ secrets.LIVE_WIND_POINT_DATABASE_URL }}
      LIVE_WIND_EXACT_RUN_MIN_FREE_BYTES: "0"
      LIVE_WIND_EXACT_CAPTURE_TILE_LIMIT: ${{ vars.LIVE_WIND_EXACT_CAPTURE_TILE_LIMIT || '16' }}
      LIVE_WIND_EXACT_POINT_BATCH_SIZE: ${{ vars.LIVE_WIND_EXACT_POINT_BATCH_SIZE || '16' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Configure the job-local exact asset cache
        shell: bash
        run: |
          cache_dir="$RUNNER_TEMP/live-wind-exact"
          mkdir -p "$cache_dir"
          printf 'LIVE_WIND_EXACT_RUN_CACHE_DIR=%s\n' "$cache_dir" >> "$GITHUB_ENV"

      - name: Validate fail-closed point-capture configuration
        shell: bash
        run: |
          test -n "$DATABASE_URL"
          test "$LIVE_WIND_EXACT_RUN_CACHE_DIR" = "$RUNNER_TEMP/live-wind-exact"

      - name: Install exact model dependencies
        run: pip install -r requirements.txt

      - name: Capture and persist bounded exact u-v point bundles
        run: python -m scripts.exact_run_worker capture
