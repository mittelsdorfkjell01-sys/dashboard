name: Nonproduction Station Catalog Capture

on:
  schedule:
    - cron: "27 2 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: nonproduction-station-catalog-capture
  cancel-in-progress: false

jobs:
  catalog:
    if: github.ref == 'refs/heads/main' && vars.LIVE_WIND_CAPTURE_CATALOG_ENABLED == 'true'
    runs-on: [self-hosted, linux, live-wind]
    timeout-minutes: 15
    env:
      TZ: UTC
      APP_ENV: development
      DEPLOYMENT_MODE: development
      ENABLE_ADMIN_API: "false"
      DATABASE_URL: ${{ secrets.LIVE_WIND_CAPTURE_DATABASE_URL }}
      REDIS_URL: ${{ secrets.LIVE_WIND_CAPTURE_REDIS_URL }}
      LIVE_WIND_ROLLOUT_STAGE: shadow
      LIVE_WIND_FORCE_BASELINE: "true"
      LIVE_WIND_ENABLED_REGION_SLUGS: ""
      LIVE_WIND_EXACT_CAPTURE_MODE: scheduled
      LIVE_WIND_EXACT_RUN_CACHE_DIR: ${{ vars.LIVE_WIND_EXACT_RUN_CACHE_DIR }}
      LIVE_WIND_EXACT_RUN_CACHE_ID: ${{ vars.LIVE_WIND_EXACT_RUN_CACHE_ID }}
      LIVE_WIND_CAPTURE_AUTHORIZED: ${{ vars.LIVE_WIND_CAPTURE_AUTHORIZED }}
      LIVE_WIND_CAPTURE_MODE: raw_only
      LIVE_WIND_CAPTURE_ENVIRONMENT_ID: ${{ vars.LIVE_WIND_CAPTURE_ENVIRONMENT_ID }}
      LIVE_WIND_RUNNER_ID: ${{ vars.LIVE_WIND_RUNNER_ID }}
      LIVE_WIND_RUNNER_JOB_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      LIVE_WIND_CAPTURE_PROBE_SHA256: ${{ secrets.LIVE_WIND_CAPTURE_PROBE_SHA256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Validate fail-closed nonproduction identity
        shell: bash
        run: |
          test "$LIVE_WIND_CAPTURE_AUTHORIZED" = "true"
          test "$LIVE_WIND_CAPTURE_MODE" = "raw_only"
          test -n "$LIVE_WIND_CAPTURE_ENVIRONMENT_ID"
          test -n "$LIVE_WIND_RUNNER_ID"
          test -n "$LIVE_WIND_EXACT_RUN_CACHE_DIR"
          test -n "$LIVE_WIND_EXACT_RUN_CACHE_ID"
          test -n "$LIVE_WIND_CAPTURE_PROBE_SHA256"

      - name: Install worker dependencies
        run: pip install -r requirements.txt

      - name: Verify DB, Redis and cache persistence from a prior runner job
        run: >-
          python -m scripts.exact_run_preflight
          --persistence verify
          --require-new-job
          --expected-probe-sha256 "$LIVE_WIND_CAPTURE_PROBE_SHA256"

      - name: Refresh DWD and DMI catalogs only
        run: python -m scripts.station_capture_worker catalog

      - name: Emit sanitized capture status
        if: always()
        run: python -m scripts.station_capture_worker status
