name: Europe Wind Measurement

on:
  schedule:
    # Two independent triggers per 30-minute campaign slot. The worker stores
    # one append-only heartbeat and deduplicates the second trigger.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: europe-wind-measurement
  cancel-in-progress: false

jobs:
  measure:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || vars.EUROPE_WIND_MEASUREMENT_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TZ: UTC
      APP_ENV: development
      DEPLOYMENT_MODE: development
      ENABLE_ADMIN_API: "false"
      DATABASE_URL: ${{ secrets.EUROPE_WIND_MEASUREMENT_DATABASE_URL }}
      EUROPE_WIND_MEASUREMENT_DATABASE_ID: ${{ vars.EUROPE_WIND_MEASUREMENT_DATABASE_ID }}
      LIVE_WIND_ROLLOUT_STAGE: shadow
      LIVE_WIND_FORCE_BASELINE: "true"
      LIVE_WIND_ENABLED_REGION_SLUGS: ""
      LIVE_WIND_EXACT_CAPTURE_MODE: scheduled
      LIVE_WIND_EXACT_RUN_MIN_FREE_BYTES: "0"
      LIVE_WIND_EXACT_CAPTURE_TILE_LIMIT: "64"
      LIVE_WIND_EXACT_POINT_BATCH_SIZE: "64"
      WEATHER_OBSERVATION_CRON_BATCH_SIZE: "64"
      WEATHER_STATION_CATALOG_LIMIT: "64"
      WEATHER_EUROPE_CAMPAIGN_STATION_LIMIT: "64"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ vars.EUROPE_WIND_MEASUREMENT_CODE_REF }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Configure ephemeral raw-model cache
        shell: bash
        run: |
          cache_dir="$RUNNER_TEMP/europe-wind-exact"
          mkdir -p "$cache_dir"
          printf 'LIVE_WIND_EXACT_RUN_CACHE_DIR=%s\n' "$cache_dir" >> "$GITHUB_ENV"

      - name: Install worker dependencies
        run: pip install -r requirements.txt

      - name: Validate campaign and dedicated database identity
        run: |
          python -m scripts.europe_measurement_status --require-active
          python -m scripts.europe_measurement_worker --validate-only

      - name: Require deployed schema head
        shell: bash
        run: |
          current="$(alembic current 2>/dev/null | tail -1 | awk '{print $1}')"
          expected="$(python -c 'from app.db.schema import EXPECTED_DB_REVISION; print(EXPECTED_DB_REVISION)')"
          test "$current" = "$expected"

      - name: Capture forecast, observations and shadow residuals once
        run: python -m scripts.europe_measurement_worker --once

      - name: Emit read-only progress counters
        if: always()
        run: python -m scripts.europe_measurement_status --database
