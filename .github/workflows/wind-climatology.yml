name: Wind Climatology Refresh

on:
  # Production scheduling lives in vercel.json so the worker necessarily uses
  # the same database as the public API. Keep this direct-database workflow as
  # an explicit recovery tool only.
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: wind-climatology-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      APP_ENV: production
      DEPLOYMENT_MODE: admin
      ENABLE_ADMIN_API: "true"
      API_DEBUG: "false"
      COOKIE_SECURE: "true"
      PASSWORD_BREACH_CHECK_ENABLED: "true"
      CORS_ORIGINS: https://surfwinddata.com
      DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
      JWT_SECRET: ${{ secrets.WEATHER_SHADOW_WORKER_JWT_SECRET }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate worker configuration
        shell: bash
        run: |
          test -n "$DATABASE_URL"
          test -n "$JWT_SECRET"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install worker dependencies
        run: pip install -r requirements.txt

      - name: Refresh every published spot
        run: python -m scripts.wind_climatology_worker
