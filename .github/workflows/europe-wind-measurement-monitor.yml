name: Monitor Europe Wind Measurement

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  health:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || vars.EUROPE_WIND_MEASUREMENT_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: UTC
      APP_ENV: development
      DEPLOYMENT_MODE: development
      DATABASE_URL: ${{ secrets.EUROPE_WIND_MEASUREMENT_DATABASE_URL }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ vars.EUROPE_WIND_MEASUREMENT_CODE_REF }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install status dependencies
        run: pip install -r requirements.txt

      - name: Require fresh, isolated campaign evidence
        run: python -m scripts.europe_measurement_status --require-healthy
