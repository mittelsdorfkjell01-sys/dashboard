name: Monitor Europe Wind Measurement

on:
  schedule:
    - cron: "14,29,44,59 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  health:
    if: github.event_name == 'workflow_dispatch' || (github.ref == 'refs/heads/main' && vars.EUROPE_WIND_MEASUREMENT_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: UTC
      APP_ENV: development
      DEPLOYMENT_MODE: development
      EUROPE_WIND_MEASUREMENT_DATABASE_URL_SHARD_1: ${{ secrets.EUROPE_WIND_MEASUREMENT_DATABASE_URL_SHARD_1 }}
      EUROPE_WIND_MEASUREMENT_DATABASE_URL_SHARD_2: ${{ secrets.EUROPE_WIND_MEASUREMENT_DATABASE_URL_SHARD_2 }}
      EUROPE_WIND_MEASUREMENT_DATABASE_URL_SHARD_3: ${{ secrets.EUROPE_WIND_MEASUREMENT_DATABASE_URL_SHARD_3 }}
      EUROPE_WIND_MEASUREMENT_DATABASE_URL_SHARD_4: ${{ secrets.EUROPE_WIND_MEASUREMENT_DATABASE_URL_SHARD_4 }}
      EUROPE_WIND_MEASUREMENT_DATABASE_URL_SHARD_5: ${{ secrets.EUROPE_WIND_MEASUREMENT_DATABASE_URL_SHARD_5 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ vars.EUROPE_WIND_MEASUREMENT_CODE_REF }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install status dependencies
        run: pip install -r requirements.txt

      - name: Select bounded measurement database shard
        run: python -m scripts.europe_measurement_shards --github-env

      - name: Require fresh, isolated campaign evidence
        run: python -m scripts.europe_measurement_status --require-healthy

      - name: Open or update missed-cadence alert
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          title="Europe wind measurement cadence alert"
          existing="$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')"
          body="The isolated Europe wind measurement campaign failed its health gate. This includes the two-missed-interval cadence gate. Inspect this workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body" --label bug
          fi
