name: Production Wave Field Publication

on:
  schedule:
    # Two complete daily runs keep the published field current while the
    # serial three-model worker stays within the free compute allowance.
    - cron: "35 7,19 * * *"
  workflow_dispatch:
    inputs:
      model:
        description: Model to publish
        type: choice
        required: true
        default: all
        options:
          - all
          - dwd-ewam
          - dwd-gwam
          - noaa-gfs-wave

permissions:
  contents: read

concurrency:
  group: production-wave-field-publication
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || (github.ref == 'refs/heads/main' && vars.WAVE_FIELD_WORKER_ENABLED == 'true')
    runs-on: ubuntu-latest
    # EWAM and GWAM each take about one hour; the serial all-model run needs an
    # independent safety window without introducing another paid worker.
    timeout-minutes: 240
    env:
      TZ: UTC
      APP_ENV: production
      DEPLOYMENT_MODE: admin
      ENABLE_ADMIN_API: "true"
      API_DEBUG: "false"
      COOKIE_SECURE: "true"
      PASSWORD_BREACH_CHECK_ENABLED: "true"
      CORS_ORIGINS: https://surfwinddata.com
      JWT_SECRET: ${{ secrets.WORKER_JWT_SECRET }}
      DATABASE_URL: ${{ secrets.POOLED_DATABASE_URL }}
      DB_SERVERLESS: "true"
      WEATHER_FIELD_PIPELINE_ENABLED: "true"
      WEATHER_FIELD_PUBLIC_ENABLED: "false"
      WAVE_FIELD_PUBLIC_ENABLED: "true"
      WAVE_FIELD_AUTO_ACTIVATE: "true"
      WAVE_BACKTEST_ARCHIVE_ENABLED: "true"
      # Two complete cycles preserve rollback while keeping all three wave
      # models comfortably inside Neon's free object-storage allowance.
      WEATHER_FIELD_RETENTION_RUNS: "2"
      # GWAM tiles plus browser series containers require about 740 MB.
      WEATHER_FIELD_ACTIVATION_MAX_ASSET_BYTES: "800000000"
      # Leaves 500 MB below Neon's 5 GB free object-storage allowance.
      WEATHER_FIELD_STORAGE_BUDGET_BYTES: "4500000000"
      WEATHER_FIELD_STORAGE_BACKEND: s3
      WEATHER_FIELD_STORAGE_BUCKET: ${{ vars.WEATHER_FIELD_STORAGE_BUCKET }}
      WEATHER_FIELD_STORAGE_PREFIX: ${{ vars.WEATHER_FIELD_STORAGE_PREFIX }}
      WEATHER_FIELD_STORAGE_ADDRESSING_STYLE: path

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Install field-worker dependencies
        run: pip install -r requirements.txt

      - name: Resolve branch-scoped Neon Object Storage
        shell: bash
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
        run: |
          runtime_env="$RUNNER_TEMP/neon-object-storage.env"
          npx -y neon@latest env pull \
            --project-id "$NEON_PROJECT_ID" \
            --branch production \
            --file "$runtime_env" \
            --service object-storage \
            --no-analytics
          set -a
          source "$runtime_env"
          set +a
          test -n "$AWS_ENDPOINT_URL_S3"
          test -n "$AWS_REGION"
          test -n "$AWS_ACCESS_KEY_ID"
          test -n "$AWS_SECRET_ACCESS_KEY"
          echo "::add-mask::$AWS_ACCESS_KEY_ID"
          echo "::add-mask::$AWS_SECRET_ACCESS_KEY"
          {
            echo "WEATHER_FIELD_STORAGE_ENDPOINT=${AWS_ENDPOINT_URL_S3%/}"
            echo "WEATHER_FIELD_STORAGE_REGION=$AWS_REGION"
            echo "WEATHER_FIELD_STORAGE_ACCESS_KEY=$AWS_ACCESS_KEY_ID"
            echo "WEATHER_FIELD_STORAGE_SECRET_KEY=$AWS_SECRET_ACCESS_KEY"
            echo "WEATHER_FIELD_PUBLIC_BASE_URL=${AWS_ENDPOINT_URL_S3%/}/$WEATHER_FIELD_STORAGE_BUCKET"
          } >> "$GITHUB_ENV"
          rm -f "$runtime_env"

      - name: Validate database and object-storage configuration
        shell: bash
        run: |
          test -n "$DATABASE_URL"
          test -n "$WEATHER_FIELD_STORAGE_ENDPOINT"
          test -n "$WEATHER_FIELD_STORAGE_BUCKET"
          test -n "$WEATHER_FIELD_STORAGE_ACCESS_KEY"
          test -n "$WEATHER_FIELD_STORAGE_SECRET_KEY"
          test -n "$WEATHER_FIELD_PUBLIC_BASE_URL"
          case "$WEATHER_FIELD_PUBLIC_BASE_URL" in https://*) ;; *) exit 1 ;; esac
          current="$(alembic current 2>/dev/null | tail -1 | awk '{print $1}')"
          expected="$(python -c 'from app.db.schema import EXPECTED_DB_REVISION; print(EXPECTED_DB_REVISION)')"
          test "$current" = "$expected"
          python -m scripts.weather_field_storage_smoke

      - name: Publish complete model horizons sequentially
        shell: bash
        env:
          TARGET_MODEL: ${{ inputs.model || 'all' }}
        run: |
          status=0
          for model in dwd-ewam dwd-gwam noaa-gfs-wave; do
            if [ "$TARGET_MODEL" != "all" ] && [ "$TARGET_MODEL" != "$model" ]; then
              continue
            fi
            python -m scripts.wave_field_publish --model "$model" --activate || status=1
          done
          exit "$status"

      - name: Verify publication health and storage allowance
        if: always() && (github.event_name != 'workflow_dispatch' || inputs.model == 'all')
        run: python -m scripts.weather_field_doctor --require-waves --fail-on-alert --pretty
