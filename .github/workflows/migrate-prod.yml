name: Production database recovery

on:
  workflow_dispatch:
    inputs:
      backup_confirmed:
        description: "Type BACKUP CONFIRMED after verifying a restorable recovery point"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-database-recovery
  cancel-in-progress: false

jobs:
  migrate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - name: Require explicit backup confirmation
        env:
          BACKUP_CONFIRMED: ${{ inputs.backup_confirmed }}
        run: test "$BACKUP_CONFIRMED" = "BACKUP CONFIRMED"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-migrate.txt

      - name: Install migration dependencies
        run: pip install --disable-pip-version-check -r requirements-migrate.txt

      - name: Check connections, current schema, and target
        env:
          DIRECT_DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
          POOLED_DATABASE_URL: ${{ secrets.POOLED_DATABASE_URL }}
        run: python -m scripts.production_readiness database

      - name: Migrate to the application target
        env:
          DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
        run: python -m alembic upgrade head

      - name: Verify target through direct and pooled connections
        env:
          DIRECT_DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
          POOLED_DATABASE_URL: ${{ secrets.POOLED_DATABASE_URL }}
        run: python -m scripts.production_readiness database --require-target

      - name: Readiness and minimal public API smoke tests
        env:
          PRODUCTION_API_BASE_URL: ${{ secrets.PRODUCTION_API_BASE_URL }}
        run: python -m scripts.production_readiness api-smoke
