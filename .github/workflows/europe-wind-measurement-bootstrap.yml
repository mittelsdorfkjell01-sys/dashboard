name: Bootstrap Europe Wind Measurement Database

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type APPLY-0078 to migrate the dedicated measurement database"
        required: true
        type: string

permissions:
  contents: read

jobs:
  migrate:
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'APPLY-0078'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: UTC
      APP_ENV: development
      DEPLOYMENT_MODE: development
      DATABASE_URL: ${{ secrets.EUROPE_WIND_MEASUREMENT_DATABASE_URL }}
      EUROPE_WIND_MEASUREMENT_DATABASE_ID: ${{ vars.EUROPE_WIND_MEASUREMENT_DATABASE_ID }}
      LIVE_WIND_ROLLOUT_STAGE: shadow
      LIVE_WIND_FORCE_BASELINE: "true"
      LIVE_WIND_ENABLED_REGION_SLUGS: ""
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ vars.EUROPE_WIND_MEASUREMENT_CODE_REF }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install migration dependencies
        run: pip install -r requirements.txt

      - name: Validate dedicated database identity
        run: python -m scripts.europe_measurement_worker --validate-only

      - name: Apply repository migrations
        run: alembic upgrade head

      - name: Verify campaign schema and counters
        run: |
          alembic current
          python -m scripts.europe_measurement_status --database
