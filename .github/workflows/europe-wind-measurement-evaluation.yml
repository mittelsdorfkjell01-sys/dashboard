name: Evaluate Europe Wind Measurement Shards

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: UTC
      APP_ENV: development
      DEPLOYMENT_MODE: development
      EUROPE_WIND_MEASUREMENT_DATABASE_URL_SHARD_1: ${{ secrets.EUROPE_WIND_MEASUREMENT_DATABASE_URL_SHARD_1 }}
      EUROPE_WIND_MEASUREMENT_DATABASE_URL_SHARD_2: ${{ secrets.EUROPE_WIND_MEASUREMENT_DATABASE_URL_SHARD_2 }}
      EUROPE_WIND_MEASUREMENT_DATABASE_URL_SHARD_3: ${{ secrets.EUROPE_WIND_MEASUREMENT_DATABASE_URL_SHARD_3 }}
      EUROPE_WIND_MEASUREMENT_DATABASE_URL_SHARD_4: ${{ secrets.EUROPE_WIND_MEASUREMENT_DATABASE_URL_SHARD_4 }}
      EUROPE_WIND_MEASUREMENT_DATABASE_URL_SHARD_5: ${{ secrets.EUROPE_WIND_MEASUREMENT_DATABASE_URL_SHARD_5 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install read-only evaluation dependencies
        run: pip install -r requirements.txt

      - name: Aggregate all five measurement shards
        run: python -m scripts.europe_measurement_evaluation --output europe-wind-measurement-evaluation.json

      - name: Upload evaluation evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: europe-wind-measurement-evaluation
          path: europe-wind-measurement-evaluation.json
          if-no-files-found: error
          retention-days: 30
