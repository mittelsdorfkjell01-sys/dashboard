name: LiveWind Shadow Operations

on:
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: live-wind-shadow-operations
  cancel-in-progress: false

jobs:
  shadow:
    if: github.ref == 'refs/heads/main' && vars.LIVE_WIND_SHADOW_ENABLED == 'true'
    # Requires a persistent, shared raw-asset mount; a hosted ephemeral runner
    # cannot prove first-seen availability across analysis cycles.
    runs-on: [self-hosted, linux, live-wind]
    timeout-minutes: 15
    env:
      APP_ENV: production
      DEPLOYMENT_MODE: admin
      ENABLE_ADMIN_API: "true"
      API_DEBUG: "false"
      COOKIE_SECURE: "true"
      PASSWORD_BREACH_CHECK_ENABLED: "true"
      CORS_ORIGINS: https://dashboardsurfwind.vercel.app
      DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
      REDIS_URL: ${{ secrets.REDIS_URL }}
      JWT_SECRET: ${{ secrets.LIVE_WIND_WORKER_JWT_SECRET }}
      CRON_SECRET: ${{ secrets.LIVE_WIND_CRON_SECRET }}
      WEATHER_OBSERVATION_ENDPOINT: ${{ vars.WEATHER_OBSERVATION_ENDPOINT }}
      LIVE_WIND_ENDPOINT: ${{ vars.LIVE_WIND_ENDPOINT }}
      LIVE_WIND_ROLLOUT_STAGE: shadow
      LIVE_WIND_FORCE_BASELINE: "true"
      LIVE_WIND_EXACT_RUN_CACHE_DIR: ${{ vars.LIVE_WIND_EXACT_RUN_CACHE_DIR }}
      LIVE_WIND_EXACT_RUN_CACHE_ID: ${{ vars.LIVE_WIND_EXACT_RUN_CACHE_ID }}
      LIVE_WIND_EXACT_CAPTURE_MODE: scheduled
      LIVE_WIND_HOLDOUT_TRAINING_MANIFEST: ${{ vars.LIVE_WIND_HOLDOUT_TRAINING_MANIFEST }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Validate shadow-only configuration
        shell: bash
        run: |
          test -n "$DATABASE_URL"
          test -n "$REDIS_URL"
          test -n "$JWT_SECRET"
          test -n "$CRON_SECRET"
          test -n "$WEATHER_OBSERVATION_ENDPOINT"
          test -n "$LIVE_WIND_ENDPOINT"
          test -n "$LIVE_WIND_EXACT_RUN_CACHE_DIR"
          test -n "$LIVE_WIND_EXACT_RUN_CACHE_ID"
          test "$LIVE_WIND_ROLLOUT_STAGE" = "shadow"

      - name: Install worker dependencies
        run: pip install -r requirements.txt

      - name: Verify database, Redis and persistent exact-run cache
        run: python -m scripts.exact_run_preflight

      - name: Capture exact model assets before observations arrive
        continue-on-error: true
        run: python -m scripts.exact_run_worker capture

      - name: Import a fair station batch
        shell: bash
        run: |
          curl --fail-with-body --silent --show-error \
            --max-time 55 --retry 3 --retry-delay 5 --retry-all-errors \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            "$WEATHER_OBSERVATION_ENDPOINT"

      - name: Produce immutable station residual evidence
        continue-on-error: true
        run: python -m scripts.exact_run_worker residuals

      - name: Enqueue a fair LiveWind batch
        shell: bash
        run: |
          curl --fail-with-body --silent --show-error \
            --max-time 30 --retry 3 --retry-delay 5 --retry-all-errors \
            --request POST \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            --header "Content-Type: application/json" \
            "$LIVE_WIND_ENDPOINT"

      - name: Drain the bounded shadow batch
        run: python -m scripts.live_wind_worker

      - name: Build immutable spatial holdout cases
        shell: bash
        run: |
          args=(build --limit 25)
          if [ -n "${LIVE_WIND_HOLDOUT_TRAINING_MANIFEST:-}" ]; then
            args+=(--training-manifest "$LIVE_WIND_HOLDOUT_TRAINING_MANIFEST")
          fi
          python -m scripts.live_wind_holdouts "${args[@]}"

      - name: Verify audited holdouts when a reviewed training manifest exists
        if: env.LIVE_WIND_HOLDOUT_TRAINING_MANIFEST != ''
        run: python -m scripts.live_wind_holdouts verify --training-manifest "$LIVE_WIND_HOLDOUT_TRAINING_MANIFEST"

      - name: Check provider and scheduler health
        if: always()
        run: python -m scripts.live_wind_doctor --no-rasters --fail-on-alert
