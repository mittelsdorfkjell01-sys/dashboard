proxy_cache_path /var/cache/nginx/api levels=1:2 keys_zone=surfwind_api:32m
                 max_size=1g inactive=24h use_temp_path=off;

map $request_uri $public_route {
    default 0;
    ~^/spots/landing(?:\?|$) 1;
    ~^/spots/version(?:\?|$) 1;
    ~^/regions(?:/|\?|$) 1;
    ~^/weather-fields/(?:wind|waves)(?:\?|$) 1;
}
map $http_authorization $has_authorization { default 1; "" 0; }
map $http_cookie $has_cookie { default 1; "" 0; }
map "$request_method:$public_route:$has_authorization:$has_cookie" $skip_cache {
    default 1;
    "GET:1:0:0" 0;
}

server {
    listen 8080;

    location / {
        proxy_pass http://app:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

        proxy_cache surfwind_api;
        proxy_cache_methods GET HEAD;
        proxy_cache_bypass $skip_cache;
        proxy_no_cache $skip_cache;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 5s;
        proxy_cache_background_update on;
        proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;
        # These routes are explicitly public and whitelisted above. Keep the
        # shared copy for ten minutes even when the browser-facing max-age is
        # shorter; Set-Cookie still prevents storage automatically.
        proxy_ignore_headers Expires Cache-Control;
        # Manifest pointers are checksum-addressed and small. A one-minute edge
        # window absorbs bursts while exposing a newly activated run quickly.
        proxy_cache_valid 200 1m;
        add_header X-Proxy-Cache $upstream_cache_status always;
    }
}
