# Production stack for a single VPS (Docker Compose). Run with:
#
#   docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --build
#
# The --env-file flag makes the ${...} values below resolve from .env.prod (for
# compose interpolation), while `env_file:` passes each service its own vars.
# Same postgis/redis images as the dev compose. Nothing but Caddy publishes a
# port; app/db/redis talk over the internal network only.

services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    shm_size: ${POSTGRES_SHM_SIZE:-1gb}
    command:
      - postgres
      - -c
      - shared_buffers=${POSTGRES_SHARED_BUFFERS:-512MB}
      - -c
      - effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:-2GB}
      - -c
      - work_mem=${POSTGRES_WORK_MEM:-8MB}
      - -c
      - maintenance_work_mem=${POSTGRES_MAINTENANCE_WORK_MEM:-128MB}
      - -c
      - max_connections=${POSTGRES_MAX_CONNECTIONS:-50}
      - -c
      - random_page_cost=${POSTGRES_RANDOM_PAGE_COST:-1.1}
      - -c
      - wal_compression=on
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Pure cache: no persistence needed (entries rebuild from Open-Meteo).
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - ${REDIS_MAXMEMORY:-512mb}
      - --maxmemory-policy
      - allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  migrate:
    build: .
    restart: "no"
    env_file:
      - .env.prod
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      DATABASE_DIRECT_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["alembic", "upgrade", "head"]

  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      # Built from the individual POSTGRES_* so the password lives in exactly one
      # place; host is the compose service name.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-10}
      DB_POOL_TIMEOUT_SECONDS: ${DB_POOL_TIMEOUT_SECONDS:-10}
      DB_POOL_RECYCLE_SECONDS: ${DB_POOL_RECYCLE_SECONDS:-1800}
      FEATURED_WARMUP_ENABLED: "false"
      # The dedicated maintenance service owns every provider/retention job.
      RUN_MAINTENANCE_CRONS: "false"
      RUN_DB_MIGRATIONS: "false"
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    volumes:
      - media:/app/data/media
      - geodata:/app/data/geodata-cache
      - weather_fields:/app/data/weather-fields
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=4).status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 40s

  cache-warmup:
    build: .
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      DB_POOL_SIZE: "2"
      DB_MAX_OVERFLOW: "0"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Keep provider/forecast work out of the latency-sensitive web process.
    entrypoint:
      - python
      - -m
      - app.discovery.warmup
      - --loop
      - --interval
      - ${FEATURED_WARMUP_INTERVAL:-1800}

  maintenance-worker:
    build: .
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      DB_POOL_SIZE: "3"
      DB_MAX_OVERFLOW: "0"
      RUN_MAINTENANCE_CRONS: "true"
      FEATURED_WARMUP_ENABLED: "false"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - media:/app/data/media
      - geodata:/app/data/geodata-cache
      - weather_fields:/app/data/weather-fields
    entrypoint: ["python", "-m", "app.maintenance.worker"]

  weather-field-worker:
    build: .
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      DB_POOL_SIZE: "2"
      DB_MAX_OVERFLOW: "0"
      FEATURED_WARMUP_ENABLED: "false"
      RUN_MAINTENANCE_CRONS: "false"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - weather_fields:/app/data/weather-fields
    entrypoint: ["python", "scripts/weather_field_worker.py", "--loop"]
    healthcheck:
      test: ["CMD", "python", "scripts/weather_field_doctor.py", "--require-public", "--fail-on-alert"]
      interval: 15m
      timeout: 60s
      retries: 2
      start_period: 45m

  api-cache:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - ./deploy/nginx-api-cache.conf:/etc/nginx/conf.d/default.conf:ro
      - api_cache:/var/cache/nginx

  caddy:
    # Custom image = Caddy + the built SPA baked in (frontend/Dockerfile). Serves
    # the app at / and reverse-proxies /api/* to the backend on one origin.
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Same-origin API base baked into the SPA at build time.
        VITE_API_URL: /api
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    env_file:
      - .env.prod
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - weather_fields:/srv/weather-field-assets:ro
    depends_on:
      api-cache:
        condition: service_started

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      RETENTION_DAYS: "14"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # ./backups is a HOST bind mount — survives `docker compose down -v`.
      - ./backups:/backups
      - media:/media:ro
      - ./scripts/backup.sh:/usr/local/bin/backup.sh:ro
      - ./scripts/backup_health.sh:/usr/local/bin/backup_health.sh:ro
    # One backup at start, then every 24h. `|| true` keeps the loop alive if a
    # single run fails (restart policy covers a hard crash).
    entrypoint: ["/bin/sh", "-c", "while true; do sh /usr/local/bin/backup.sh || echo '[backup] run FAILED'; sleep 86400; done"]
    healthcheck:
      test: ["CMD", "sh", "/usr/local/bin/backup_health.sh"]
      interval: 1h
      timeout: 30s
      retries: 3
      start_period: 30m

volumes:
  pgdata:
  media:
  geodata:
  weather_fields:
  caddy_data:
  caddy_config:
  api_cache:
