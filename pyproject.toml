[project]
name = "surfwinddate"
version = "0.1.0"
description = "Full-stack watersport spot, forecast, and trip-planning platform"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.setuptools.packages.find]
include = ["app*"]
